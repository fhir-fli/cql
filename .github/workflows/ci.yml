name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # ucum 0.9.1 from its repository until it is on pub.dev, so the engine
      # is tested against the ucum that ships with it (2026-10-04).
      # pubspec_overrides.yaml is gitignored; this is build-time only.
      - name: Override unpublished dependencies
        run: |
          {
            echo "dependency_overrides:"
            echo "  ucum:"
            echo "    git:"
            echo "      url: https://github.com/fhir-fli/ucum.git"
            echo "      ref: main"
          } > pubspec_overrides.yaml
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Run tests
        if: hashFiles('test/**') != ''
        run: dart test
